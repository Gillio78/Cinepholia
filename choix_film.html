<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinephoria - Choix du film</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav id="menu">
            <a href="accueil.html">
                <img id="Logo" src="Photos/Cinépholia.jpg" alt="Cinépholia">
            </a>
            <ul>
                <li class="titre"><a href="connexion.html">Connexion</a></li>
                <li class="titre"><a href="choix_film.html">Réservation</a></li>
                <li class="titre"><a href="films.html">Films</a></li>
                <li class="titre"><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Réservation</h1>

        <h2>Choix du cinéma :</h2>
        <form>
            <select id="cinema">
                <option value="">Sélectionnez un cinéma</option>
            </select>
        </form><br><br>

        <h2>Choix du film :</h2>
        <form>
            <select id="film">
                <option value="">Sélectionnez un film</option>
            </select>
        </form><br><br>

        <button id="validation" disabled>Valider le choix du film</button><br><br>
    </main>

    <footer>
        <p> Adresse : 10, Impasse de l'écran noir 75009 Paris</p>
        <p>Téléphone : 06.xx.xx.xx.09</p>
        <p>Horaires : Toute la semaine de 14H00 à 23H00.</p>
    </footer>

    <script>
        // Déclaration globale des variables
        let selectedCinema = null;
        let selectedFilm = null;

        // Récupération des cinémas
        fetch('/getCinemas')
            .then(response => response.json())
            .then(cinemas => {
                const dropdown = document.getElementById('cinema');
                cinemas.forEach(cinema => {
                    const option = document.createElement('option');
                    option.value = cinema.nom_cinema; // Utilisation du nom du cinéma
                    option.textContent = cinema.nom_cinema;
                    dropdown.appendChild(option);
                });
            })
            .catch(error => console.error('Erreur lors de la récupération des cinémas :', error));

        // Écoute du changement de sélection du cinéma
        document.getElementById('cinema').addEventListener('change', (event) => {
            selectedCinema = event.target.value;
            console.log(`Cinéma sélectionné : ${selectedCinema}`);

            // Requête pour récupérer les films associés
            fetch(`/getFilmsByCinema?cinema=${encodeURIComponent(selectedCinema)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Erreur HTTP : ${response.status}`);
                    }
                    return response.json();
                })
                .then(films => {
                    console.log(`Films récupérés pour le cinéma ${selectedCinema} :`, films);
                    const filmDropdown = document.getElementById('film');
                    filmDropdown.innerHTML = '<option value="">Sélectionnez un film</option>'; // Réinitialisation

                    films.forEach(film => {
                        const option = document.createElement('option');
                        option.value = film.titre;
                        option.textContent = film.titre;
                        filmDropdown.appendChild(option);
                    });

                    // Active le bouton de validation uniquement si un cinéma est sélectionné
                    document.getElementById('validation').disabled = false;
                })
                .catch(error => console.error('Erreur lors de la récupération des films :', error));
        });

        // Gestion du bouton de validation
        document.getElementById('validation').addEventListener('click', () => {
            selectedFilm = document.getElementById('film').value;

            if (!selectedCinema) {
                alert('Veuillez sélectionner un cinéma.');
                return;
            }

            if (!selectedFilm) {
                alert('Veuillez sélectionner un film.');
                return;
            }

            // Affichage des valeurs avant la redirection
            //alert(`Cinéma : ${selectedCinema}, Film : ${selectedFilm}`);

            // Redirection avec les paramètres corrects
            window.location.href = `choix_seance.html?cinema=${encodeURIComponent(selectedCinema)}&film=${encodeURIComponent(selectedFilm)}`;
        });
    </script>
</body>
</html>
