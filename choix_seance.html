    <main>
        <h1>Réservation de la séance :</h1><br><br>
        <p id="messageSeance"></p><br><br>
        <p>Choisissez la séance en cliquant dessus:</p><br><br>
        <p id="jourSemaine"></p>
        <table>
            <thead>
                <tr id="joursEnTete">
                    <!-- Les jours récupérés seront insérés ici -->
                </tr>
            </thead>
            <tbody>
                <!--Les horaires sont affichées ici-->
            </tbody>
        </table>
        <!-- Conteneur pour afficher les tarifs avec les sélecteurs de quantité -->
    <div class="tarif-container">
      <!-- Les tarifs seront insérés ici via JavaScript -->
    </div>
        
        

      
        



    </main>
    <footer>
        <p> Adresse : 10, Impasse de l'écran noir 75009 Paris</p>
        <p>Téléphone : 06.xx.xx.xx.09</p>
        <p>Horaires : Toute la semaine de 14H00 à 23H00.</p>
    </footer>

    <script>

        // Récupérez les paramètres de l'URL
const urlParams = new URLSearchParams(window.location.search);
const selectedCinema = urlParams.get('cinema');
const selectedFilm = urlParams.get('film');

if (selectedFilm) {
    // Créez un message avec le film sélectionné
    const message = `Veuillez sélectionner la séance pour le film ${selectedFilm} et le cinéma ${selectedCinema}.`;

    document.getElementById('messageSeance').textContent = message;
} else {
    document.getElementById('messageSeance').textContent = 'Aucun film sélectionné.';
}

// Initialisez une constante pour les jours récupérés
let jours = [];



    fetch('http://localhost:3001/joursSemaineAbreges')
    .then(response => {
        if (!response.ok) {
            throw new Error('Erreur lors de la récupération des jours de la semaine.');
        }
        return response.json();
    })
    .then(data => {
        const jours = data.map(jour => jour.jour_abrege); // Récupérer les abréviations des jours
        const headerRow = document.getElementById('joursEnTete');

        jours.forEach(jour => {
            const headerCell = document.createElement('th');
            headerCell.textContent = jour;
            headerRow.appendChild(headerCell);
        });

        // Ajustez l'indice pour correspondre au format de votre table
        const dateActuelle = new Date();
        let jourIndex = dateActuelle.getDay(); // Obtenir l'indice selon JavaScript
        jourIndex = (jourIndex - 3 + 7) % 7; // Cela garantit un indice positif entre 0 et 6

        const jourActuel = jours[jourIndex];

        if (jourActuel) {
            Array.from(headerRow.children).forEach(cell => {
                if (cell.textContent === jourActuel) {
                    cell.classList.add('jourActuel'); // Ajouter un style au jour actuel
                }
            });
        }
    })
    .catch(error => console.error('Erreur:', error));

    fetch(`http://localhost:3001/getSeanceData?cinema=${encodeURIComponent(selectedCinema)}&film=${encodeURIComponent(selectedFilm)}`)
    .then(response => {
        if (!response.ok) {
            throw new Error('Erreur lors de la récupération des séances.');
        }
        return response.json();
    })
    .then(data => {
        const tableBody = document.querySelector('table tbody');
        const groupedData = {};

        // Regrouper les séances par horaire et initialiser les colonnes avec des cases vides
        data.forEach(row => {
            if (!groupedData[row.horaire]) {
                groupedData[row.horaire] = Array(7).fill(''); // Initialiser avec des cases vides
            }
            groupedData[row.horaire][row.id_jour - 1] = `${row.horaire} ${row.format}`; // Insérer l'horaire et le format sous le bon jour
        });

        // Trier les horaires en ordre croissant
        const sortedHours = Object.keys(groupedData).sort((a, b) => a.localeCompare(b));

        // Insérer les données triées dans le tableau
        sortedHours.forEach(horaire => {
            const tr = document.createElement('tr');

            // Ajouter les horaires sous chaque colonne correspondant au jour, en laissant les cases vides si nécessaire
            groupedData[horaire].forEach((cellContent, index) => {
                const td = document.createElement('td');
                td.textContent = cellContent ? cellContent : ''; // Assurer que la case reste vide si aucune séance
                tr.appendChild(td);
            });

            tableBody.appendChild(tr);
        });
    })
    .catch(error => {
        console.error('Erreur :', error);
    });

    //Affichage de la totalité des tarifs
fetch('http://localhost:3001/tarifs') // Requête vers l'API des tarifs
    .then(response => {
        if (!response.ok) {
            throw new Error('Erreur lors de la récupération des tarifs.');
        }
        return response.json();
    })
    .then(data => {
        console.log("Données des tarifs :", data); // Vérifie les données reçues

        const tarifContainer = document.querySelector('.tarif-container'); // Sélectionne le conteneur

        data.forEach(tarif => {
            const h2 = document.createElement('h2'); // Crée un élément <h2>
            h2.classList.add('tarif'); // Ajoute la classe CSS
            h2.textContent = `${tarif.type_place} : ${tarif.prix}€`; // Insère le texte
            tarifContainer.appendChild(h2); // Ajoute l'élément dans le conteneur
        });
    })
    .catch(error => {
        console.error('Erreur :', error);
    });

//Validation du choix de la séance
document.addEventListener('DOMContentLoaded', function () {
    document.querySelector('table tbody').addEventListener('click', function (event) {
        if (event.target.tagName === "TD" && event.target.textContent.trim() !== "") {
            const selectedHoraire = event.target.textContent.trim();
            const jourIndex = event.target.cellIndex; // Index de la colonne cliquée

            // Tableau des jours où l'index 1 correspond à mardi
            const jours = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];

            const jourSelectionne = jours[jourIndex - 1] || "Jour inconnu"; // Ajuster l'index (-1 car tableau commence à 0)

            const message = `Vous avez choisi la séance du ${jourSelectionne} à ${selectedHoraire}.`;
            alert(message); // Affiche une boîte de dialogue avec le message
        }
    });
});



  //Affichage des tarifs et quntité de places
document.addEventListener('DOMContentLoaded', function () {
    const tableBody = document.querySelector('table tbody');
    const tarifContainer = document.querySelector('.tarif-container');
    let seanceSelectionnee = false; // Indicateur pour savoir si une séance est choisie

    // Événement de sélection d'une séance
    tableBody.addEventListener('click', function (event) {
        if (event.target.tagName === "TD" && event.target.textContent.trim() !== "") {
            seanceSelectionnee = true; // La séance est maintenant sélectionnée
            const selectedHoraire = event.target.textContent.trim();
            const jourIndex = event.target.cellIndex;

            const jours = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
            const jourSelectionne = jours[jourIndex - 1] || "Jour inconnu";

            const message = `Vous avez choisi la séance du ${jourSelectionne} à ${selectedHoraire}.`;
            alert(message); // Affiche un message de confirmation

            // Activer les boutons de quantité une fois la séance sélectionnée
            document.querySelectorAll('.btn-quantite').forEach(btn => btn.disabled = false);
        }
    });

    // Récupération et affichage des tarifs avec sélecteurs de quantité
    fetch('http://localhost:3001/tarifs')
        .then(response => {
            if (!response.ok) {
                throw new Error('Erreur lors de la récupération des tarifs.');
            }
            return response.json();
        })
        .then(data => {
            tarifContainer.innerHTML = ""; // Nettoyage du conteneur avant ajout

            data.forEach(tarif => {
                const tarifBlock = document.createElement('div');
                tarifBlock.classList.add('tarif-block');

                const spanType = document.createElement('span');
                spanType.classList.add('tarif-type');
                spanType.textContent = `${tarif.type_place} - ${tarif.prix}€`;

                const btnMoins = document.createElement('button');
                btnMoins.textContent = "-";
                btnMoins.classList.add('btn-quantite');
                btnMoins.disabled = true; // Désactivé au départ

                const spanQuantite = document.createElement('span');
                spanQuantite.classList.add('quantite-number');
                spanQuantite.textContent = " 0 ";

                const btnPlus = document.createElement('button');
                btnPlus.textContent = "+";
                btnPlus.classList.add('btn-quantite');
                btnPlus.disabled = true; // Désactivé au départ

                // Ajout des événements avec **vérification immédiate**
                btnMoins.addEventListener('click', () => {
                    if (!seanceSelectionnee) {
                        alert("Veuillez choisir une séance avant de modifier la quantité.");
                        return;
                    }
                    let current = parseInt(spanQuantite.textContent.trim());
                    if (current > 0) {
                        spanQuantite.textContent = ` ${current - 1} `;
                    }
                });

                btnPlus.addEventListener('click', () => {
                    if (!seanceSelectionnee) {
                        alert("Veuillez choisir une séance avant de modifier la quantité.");
                        return;
                    }
                    let current = parseInt(spanQuantite.textContent.trim());
                    spanQuantite.textContent = ` ${current + 1} `;
                });

                tarifBlock.appendChild(spanType);
                tarifBlock.appendChild(btnMoins);
                tarifBlock.appendChild(spanQuantite);
                tarifBlock.appendChild(btnPlus);
                tarifContainer.appendChild(tarifBlock);
            });
        })
        .catch(error => console.error('Erreur :', error));
});
